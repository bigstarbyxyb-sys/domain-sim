<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领域斩击模拟器</title>
<style>
  html,body{margin:0;height:100%;background:#07070b;color:#98a0ad;font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div>正在进入最新版本…</div>
<script>
(function () {
  var base = new URL(".", location.href);
  var fallback = "app.html";
  try {
    fetch(base + "version.json?ts=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (txt) {
        var v = (txt || "").trim() || String(Date.now());
        location.replace(base + "app.html?v=" + encodeURIComponent(v));
      })
      .catch(function () { location.replace(base + fallback); });
  } catch (e) {
    location.replace(base + fallback);
  }
})();
</script>
</body>
</html>
